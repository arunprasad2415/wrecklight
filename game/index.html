<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>WRECKLIGHT — a descent through the drowned lighthouse</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #03060a;
    overflow: hidden;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  #stage {
    display: block;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    /* 16:10 letterbox: the larger fit of the window, never larger than either axis. */
    width: min(100vw, 160vh);
    height: min(100vh, 62.5vw);
    background: #03060a;
    cursor: crosshair;
    touch-action: none;
  }
</style>
</head>
<body>
  <canvas id="stage" width="1280" height="800" aria-label="WRECKLIGHT, a top-down roguelite in a drowned lighthouse"></canvas>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
